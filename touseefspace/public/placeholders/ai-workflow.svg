<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" rx="16" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1199" height="749" rx="15.5" stroke="#262626"/>

  <!-- Top bar -->
