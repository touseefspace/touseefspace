    <text x="316" y="155" fill="#a0a0a0" font-family="monospace" font-size="11">• Tax &amp; Currency Conversion</text>
    <text x="316" y="175" fill="#a0a0a0" font-family="monospace" font-size="11">• Confidence Score: 99.2%</text>
